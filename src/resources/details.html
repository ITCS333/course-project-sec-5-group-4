<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Resource Details</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- JS -->
    <script src="details.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header>
        <h1 id="resource-title">Loading...</h1>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Section 1: Resource Information -->
        <article>
            <p id="resource-description">Loading description...</p>
            <a id="resource-link" href="#" target="_blank">
                Access Resource Material
            </a>
        </article>

        <!-- Section 2: Discussion Forum -->
        <section id="discussion-forum">
            <h2>Discussion</h2>

            <!-- Comments List -->
            <div id="comment-list">
                <!-- Example comment (will be replaced dynamically) -->
                <article>
                    <p>This is a sample comment.</p>
                    <footer>Posted by: User</footer>
                </article>
            </div>

            <!-- Add Comment Form -->
            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>

                    <label for="new-comment">Your Comment:</label>
                    <textarea id="new-comment" required></textarea>

                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>

    </main>

</body>
</html>
