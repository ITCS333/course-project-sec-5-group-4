<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Manage Resources</title>

    <!-- Example CSS (you can replace with your own or a framework like Bootstrap) -->
    <link rel="stylesheet" href="styles.css">

    <!-- JS file -->
    <script src="admin.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Manage Course Resources</h1>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Section 1: Add/Edit Resource Form -->
        <section>
            <h2>Add a New Resource</h2>

            <form id="resource-form" action="#">
                <fieldset>
                    <legend>Resource Details</legend>

                    <!-- Title -->
                    <label for="resource-title">Title:</label>
                    <input type="text" id="resource-title" required>

                    <!-- Description -->
                    <label for="resource-description">Description:</label>
                    <textarea id="resource-description"></textarea>

                    <!-- Link -->
                    <label for="resource-link">Link:</label>
                    <input type="url" id="resource-link" required>

                    <!-- Submit Button -->
                    <button id="add-resource" type="submit">Add Resource</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Resources List -->
        <section>
            <h2>Existing Resources</h2>

            <table id="resources-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Link</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="resources-tbody">
                    <!-- Example static row (JS will replace/add dynamically) -->
                    <tr>
                        <td>Example Title</td>
                        <td>Example Description</td>
                        <td><a href="#">Visit</a></td>
                        <td>
                            <button class="edit-btn" data-id="1">Edit</button>
                            <button class="delete-btn" data-id="1">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
